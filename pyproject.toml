[project]
name = "auto-insurance-data-warehouse"
version = "1.0.0"
description = "Auto insurance data warehouse on SQL Server: legacy OLTP -> ODS -> star schema, T-SQL incremental ETL and data quality gate"
requires-python = ">=3.11"

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 130
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.ruff.lint.per-file-ignores]
# SVG markup of the page designs
"scripts/build_report.py" = ["E501"]
"scripts/build_architecture.py" = ["E501"]
