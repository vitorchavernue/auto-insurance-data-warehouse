<text x="82.0" y="466.0" font-family="Inter, Segoe UI, sans-serif" font-size="15.5" font-weight="400" fill="#B3A4AA" text-anchor="start">Profile the legacy</text><text x="82.0" y="489.2" font-family="Inter, Segoe UI, sans-serif" font-size="15.5" font-weight="400" fill="#B3A4AA" text-anchor="start">database and time the</text><text x="82.0" y="512.5" font-family="Inter, Segoe UI, sans-serif" font-size="15.5" font-weight="400" fill="#B3A4AA" text-anchor="start">loss ratio report (5.8</text><text x="82.0" y="535.8" font-family="Inter, Segoe UI, sans-serif" font-size="15.5" font-weight="400" fill="#B3A4AA" text-anchor="start">million reads). List</text><text x="82.0" y="559.0" font-family="Inter, Segoe UI, sans-serif" font-size="15.5" font-weight="400" fill="#B3A4AA" text-anchor="start">the data defects.</text>
