<text x="602.6" y="466.0" font-family="Inter, Segoe UI, sans-serif" font-size="15.5" font-weight="400" fill="#B3A4AA" text-anchor="start">Incremental MERGE by</text><text x="602.6" y="489.2" font-family="Inter, Segoe UI, sans-serif" font-size="15.5" font-weight="400" fill="#B3A4AA" text-anchor="start">watermark, set-based</text><text x="602.6" y="512.5" font-family="Inter, Segoe UI, sans-serif" font-size="15.5" font-weight="400" fill="#B3A4AA" text-anchor="start">cleaning functions,</text><text x="602.6" y="535.8" font-family="Inter, Segoe UI, sans-serif" font-size="15.5" font-weight="400" fill="#B3A4AA" text-anchor="start">rejected rows with</text><text x="602.6" y="559.0" font-family="Inter, Segoe UI, sans-serif" font-size="15.5" font-weight="400" fill="#B3A4AA" text-anchor="start">reason and money.</text>
