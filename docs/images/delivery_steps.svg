<text x="342.3" y="466.0" font-family="Inter, Segoe UI, sans-serif" font-size="15.5" font-weight="400" fill="#B3A4AA" text-anchor="start">ODS next to the legacy</text><text x="342.3" y="489.2" font-family="Inter, Segoe UI, sans-serif" font-size="15.5" font-weight="400" fill="#B3A4AA" text-anchor="start">system, star schema</text><text x="342.3" y="512.5" font-family="Inter, Segoe UI, sans-serif" font-size="15.5" font-weight="400" fill="#B3A4AA" text-anchor="start">with one fact per</text><text x="342.3" y="535.8" font-family="Inter, Segoe UI, sans-serif" font-size="15.5" font-weight="400" fill="#B3A4AA" text-anchor="start">question, address as</text><text x="342.3" y="559.0" font-family="Inter, Segoe UI, sans-serif" font-size="15.5" font-weight="400" fill="#B3A4AA" text-anchor="start">SCD2. Decisions as</text><text x="342.3" y="582.2" font-family="Inter, Segoe UI, sans-serif" font-size="15.5" font-weight="400" fill="#B3A4AA" text-anchor="start">ADRs.</text>
